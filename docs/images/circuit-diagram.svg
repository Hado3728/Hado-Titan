<svg width="820" height="520" viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <title>Hado Titan — Electronics Circuit Diagram</title>
  <desc>Single 6S battery powers everything through the Zerodrag Boost AM32 4-in-1 ESC: one channel drives the weapon motor through a dedicated arming switch, two channels drive the wheel motors, and the board's onboard BEC powers the receiver, which takes wireless control input from the off-board transmitter.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .box { stroke-width: 1.5; rx: 8; }
    .coral { fill: #FDE4DC; stroke: #D35400; }
    .teal { fill: #D9F2EE; stroke: #16A085; }
    .gray { fill: #ECECEC; stroke: #7F8C8D; }
    .th { font-size: 14px; font-weight: bold; fill: #222222; text-anchor: middle; dominant-baseline: central; }
    .ts { font-size: 11px; fill: #555555; text-anchor: middle; dominant-baseline: central; }
    .wire { stroke: #333333; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .rf { stroke: #7F8C8D; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    .caption { font-size: 12px; fill: #666666; text-anchor: middle; }
  </style>

  <!-- Transmitter (off-board) -->
  <rect x="620" y="30" width="160" height="50" rx="8" class="box gray" stroke-dasharray="4 3"/>
  <text x="700" y="50" class="th">Transmitter</text>
  <text x="700" y="66" class="ts">(off-board, RF)</text>

  <!-- RF link -->
  <line x1="640" y1="80" x2="560" y2="130" class="rf"/>

  <!-- Battery -->
  <rect x="330" y="30" width="180" height="56" rx="8" class="box coral"/>
  <text x="420" y="50" class="th">6S LiPo Battery</text>
  <text x="420" y="70" class="ts">Pro-Range 22.2V 3300mAh 35C</text>

  <!-- Main power switch -->
  <rect x="330" y="120" width="180" height="44" rx="8" class="box coral"/>
  <text x="420" y="142" class="th">Main Power Switch</text>

  <!-- Receiver -->
  <rect x="560" y="120" width="150" height="52" rx="8" class="box gray"/>
  <text x="635" y="138" class="th">Receiver</text>
  <text x="635" y="156" class="ts">FlySky FS-iA10B</text>

  <!-- ESC (central hub) -->
  <rect x="300" y="210" width="240" height="70" rx="8" class="box gray"/>
  <text x="420" y="234" class="th">Zerodrag Boost AM32</text>
  <text x="420" y="252" class="ts">55A 4-in-1 ESC, 3D/reverse mode</text>
  <text x="420" y="267" class="ts">+ onboard 5V BEC</text>

  <!-- Weapon arming switch -->
  <rect x="60" y="320" width="170" height="44" rx="8" class="box coral"/>
  <text x="145" y="342" class="th">Weapon Arming Switch</text>

  <!-- Weapon motor -->
  <rect x="60" y="410" width="170" height="56" rx="8" class="box coral"/>
  <text x="145" y="428" class="th">Weapon Motor</text>
  <text x="145" y="446" class="ts">Rocket 4092, 1250KV</text>

  <!-- Drive motor L -->
  <rect x="300" y="410" width="150" height="56" rx="8" class="box teal"/>
  <text x="375" y="428" class="th">Drive Motor L</text>
  <text x="375" y="446" class="ts">QPT 2807, 1300KV</text>

  <!-- Drive motor R -->
  <rect x="490" y="410" width="150" height="56" rx="8" class="box teal"/>
  <text x="565" y="428" class="th">Drive Motor R</text>
  <text x="565" y="446" class="ts">QPT 2807, 1300KV</text>

  <!-- Spare channel note -->
  <rect x="680" y="410" width="120" height="56" rx="8" class="box gray" stroke-dasharray="4 3"/>
  <text x="740" y="428" class="th">Spare Ch.</text>
  <text x="740" y="446" class="ts">unused</text>

  <!-- Wires: battery -> switch -->
  <line x1="420" y1="86" x2="420" y2="118" class="wire"/>
  <!-- switch -> ESC -->
  <line x1="420" y1="164" x2="420" y2="208" class="wire"/>
  <!-- ESC BEC -> Receiver -->
  <line x1="540" y1="230" x2="635" y2="172" class="wire"/>
  <!-- Receiver -> ESC (control signal, dashed) -->
  <line x1="600" y1="172" x2="470" y2="212" class="rf"/>

  <!-- ESC -> arming switch -> weapon motor -->
  <line x1="330" y1="270" x2="145" y2="318" class="wire"/>
  <line x1="145" y1="364" x2="145" y2="408" class="wire"/>

  <!-- ESC -> drive motor L -->
  <line x1="390" y1="280" x2="375" y2="408" class="wire"/>
  <!-- ESC -> drive motor R -->
  <line x1="460" y1="280" x2="565" y2="408" class="wire"/>
  <!-- ESC -> spare -->
  <line x1="540" y1="255" x2="740" y2="408" class="wire" stroke-dasharray="4 3"/>

  <text x="410" y="500" class="caption">Solid lines = power / motor phase wiring. Dashed = wireless RF or unused channel.</text>
</svg>
